[package]
name = "subgrind"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Fast Substrate/Polkadot/Bittensor vanity address generator (BIP39 mnemonics, regex matching)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0xKheops/subgrind"
homepage = "https://github.com/0xKheops/subgrind"
readme = "README.md"
keywords = ["substrate", "polkadot", "vanity", "ss58", "cli"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
rand = "0.8"
rand_chacha = "0.3"
ring = "0.17"
schnorrkel = "0.11"
ed25519-dalek = "2"
secp256k1 = "0.29"
blake2 = "0.10"
bs58 = "0.5"
bip39 = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
