# Builds prebuilt binaries (Linux x86_64/aarch64, macOS Intel/ARM, Windows)
# and attaches them to the GitHub release whenever a v* tag is pushed.
#
# Cutting a release:
#   1. Bump `version` in Cargo.toml, run `cargo check` (refreshes Cargo.lock),
#      commit, push, wait for CI to go green.
#   2. cargo publish
#   3. git tag -m "subgrind vX.Y.Z" vX.Y.Z && git push origin vX.Y.Z
#   4. gh release create vX.Y.Z --title "subgrind vX.Y.Z" --notes "..."
#      Do this right after pushing the tag — otherwise this workflow creates
#      a bare release (no notes) when the first binary finishes building.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="subgrind-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            cp "target/${{ matrix.target }}/release/subgrind.exe" "$name/"
            7z a "$name.zip" "$name"
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/subgrind" "$name/"
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
